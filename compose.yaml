services:
  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    restart: unless-stopped

  xmpp-bridge:
    build:
      context: ./xmpp-bridge
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - XMPP_OMEMO_STORE_DIR=/data/omemo-store
      - XMPP_CLEAR_STALE_DEVICES=true
    volumes:
      - ./omemo-store:/data/omemo-store
    depends_on:
      - nats
    restart: unless-stopped

# TODO: main chatbot

volumes:
  nats-data:
