services:
  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"
    volumes:
      - nats-data:/data
    restart: unless-stopped

  xmpp-bridge:
    build:
      context: ./xmpp-bridge
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_PREFIX=daapu
      - XMPP_OMEMO_STORE_DIR=/data/omemo-store
    volumes:
      - ./omemo-store:/data/omemo-store
    depends_on:
      - nats
    restart: unless-stopped

  daapu:
    build:
      context: .
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_PREFIX=daapu
    depends_on:
      - nats
      - xmpp-bridge
    restart: unless-stopped

volumes:
  nats-data:
